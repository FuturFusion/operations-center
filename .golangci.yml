version: "2"
linters:
  default: none
  enable:
    - bodyclose
    - depguard
    - errcheck
    - forbidigo
    - gocritic
    - godot
    - govet
    - ineffassign
    - misspell
    - nakedret
    - noinlineerr
    - prealloc
    - revive
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - staticcheck
    - testifylint
    - thelper
    - unconvert
    - unparam
    - unused
    - whitespace
    - wsl_v5
  settings:
    errcheck:
      exclude-functions:
        - (io.ReadCloser).Close
        - (io.WriteCloser).Close
        - (io.ReadWriteCloser).Close
        - (*os.File).Close
        - (*os.Root).Close
        - (*github.com/gorilla/websocket.Conn).Close
        - (*github.com/mdlayher/vsock.Listener).Close
        - os.Remove
        - (*compress/gzip.Writer).Close
    depguard:
      rules:
        # Services, the domain and the shared API are pure. They must not do I/O directly.
        # Logging is allowed. Use ports for I/O.
        pure-packages:
          list-mode: lax
          files:
            - "!$test"
            - "**/internal/provisioning/*.go"
            - "**/internal/provisioning/{channel,cluster,cluster_template,server,token,update}/*.go"
            - "**/internal/{image,inventory,system,warning}/*.go"
            - "**/internal/domain/*.go"
            - "**/shared/api/*.go"
            - "**/shared/api/*/*.go"
          deny:
            - pkg: os
              desc: Pure packages must not access the OS. Use a port.
            - pkg: os/exec
              desc: Pure packages must not run processes. Use a port.
            - pkg: os/signal
              desc: Pure packages must not handle OS signals.
            - pkg: io/ioutil
              desc: Pure packages must not access files. Use a port.
            - pkg: io/fs
              desc: Pure packages must not access files. Use a port.
            - pkg: syscall
              desc: Pure packages must not make system calls.
            # Exact match. Allows database/sql/driver.
            - pkg: database/sql$
              desc: Pure packages must not access the database. Use a repo port.
            - pkg: net/http
              desc: Pure packages must not make HTTP calls. Use a port.
            - pkg: github.com/lxc/incus/v7/client
              desc: Pure packages must not talk to Incus. Use an adapter port.
    forbidigo:
      analyze-types: true
      forbid:
        # Built-in bootstrapping functions.
        - pattern: ^print(ln)?$
        # slog without context
        - pattern: ^slog\.(Debug|Info|Warn|Error)$
          msg: Do not use slog without context
        # Test helpers in production packages, they need access to unexported state.
        - pattern: ^logger\.ContextWithTestLogger$
          pkg: ^github\.com/FuturFusion/operations-center/internal/util/logger$
          msg: Only use in tests
        - pattern: ^config\.InitTest$
          pkg: ^github\.com/FuturFusion/operations-center/internal/config/daemon$
          msg: Only use in tests
        - pattern: ^os\.
          msg: Pure packages must not use package os. Use a port.
        - pattern: ^filepath\.(Abs|EvalSymlinks|Glob|Walk|WalkDir)$
          msg: Pure packages must not read the file system. Use a port.
        - pattern: ^net\.(Dial|Listen|Lookup|Resolve)
          msg: Pure packages must not open network connections. Use a port.
        - pattern: ^tls\.Load
          msg: Pure packages must not load certificates from disk. Use a port.
        - pattern: ^time\.Sleep$
          msg: Pure packages must not block. Inject a clock or use a port.
        # File system access goes through os.Root to prevent path traversal.
        # Paths that come from the user, fixed system directories and paths for
        # external tools are excluded below or annotated with //nolint:forbidigo.
        - pattern: ^os\.(Chmod|Chown|Chtimes|Create|CreateTemp|DirFS|Lchown|Link|Lstat|Mkdir|MkdirAll|MkdirTemp|Open|OpenFile|ReadDir|ReadFile|Readlink|Remove|RemoveAll|Rename|Stat|Symlink|Truncate|WriteFile)$
          msg: Use os.Root for file system access.
        - pattern: ^filepath\.(Glob|Walk|WalkDir)$
          msg: Use os.Root for file system access, for example fs.WalkDir(root.FS(), ...).
        - pattern: ^http\.Dir$
          msg: Use os.Root for file system access, for example http.FS(root.FS()).
        - pattern: ^file\.(Copy|PathExists|WriteFileAtomic)$
          pkg: ^github\.com/FuturFusion/operations-center/internal/util/file$
          msg: Use os.Root for file system access, for example file.PathExistsIn or file.WriteFileAtomicIn.
    gocritic:
      disable-all: true
      enabled-checks:
        - ruleguard
      settings:
        ruleguard:
          rules: ./scripts/lint/ruleguard/*.go
    misspell:
      ignore-rules:
        # Interface name formed from auth
        - auther
    revive:
      rules:
        # Disabled for now while we are rushing with the development of an initial version.
        # https://github.com/mgechev/revive/blob/2a1701aadbedfcc175cb92836a51407bec382652/RULES_DESCRIPTIONS.md#exported
        # - name: exported
        #   arguments:
        #     - "checkPrivateReceivers"
        #     - "disableStutteringCheck"

        # https://github.com/mgechev/revive/blob/2a1701aadbedfcc175cb92836a51407bec382652/RULES_DESCRIPTIONS.md#import-shadowing
        - name: import-shadowing

        # https://github.com/mgechev/revive/blob/2a1701aadbedfcc175cb92836a51407bec382652/RULES_DESCRIPTIONS.md#unchecked-type-assertion
        - name: unchecked-type-assertion

        # https://github.com/mgechev/revive/blob/2a1701aadbedfcc175cb92836a51407bec382652/RULES_DESCRIPTIONS.md#var-naming
        - name: var-naming
          arguments: # The arguments here are quite odd looking. See the rule description.
            - []
            - []
            - - upperCaseConst: true

        # https://github.com/mgechev/revive/blob/2a1701aadbedfcc175cb92836a51407bec382652/RULES_DESCRIPTIONS.md#early-return
        - name: early-return

        # https://github.com/mgechev/revive/blob/2a1701aadbedfcc175cb92836a51407bec382652/RULES_DESCRIPTIONS.md#redundant-import-alias
        - name: redundant-import-alias

        # https://github.com/mgechev/revive/blob/2a1701aadbedfcc175cb92836a51407bec382652/RULES_DESCRIPTIONS.md#redefines-builtin-id
        - name: redefines-builtin-id

        # https://github.com/mgechev/revive/blob/2a1701aadbedfcc175cb92836a51407bec382652/RULES_DESCRIPTIONS.md#struct-tag
        - name: struct-tag

          # https://github.com/mgechev/revive/blob/2a1701aadbedfcc175cb92836a51407bec382652/RULES_DESCRIPTIONS.md#receiver-naming
        - name: receiver-naming

        # https://github.com/mgechev/revive/blob/2a1701aadbedfcc175cb92836a51407bec382652/RULES_DESCRIPTIONS.md#deep-exit
        - name: deep-exit

        # https://github.com/mgechev/revive/blob/2a1701aadbedfcc175cb92836a51407bec382652/RULES_DESCRIPTIONS.md#defer
        - name: defer

        # https://github.com/mgechev/revive/blob/2a1701aadbedfcc175cb92836a51407bec382652/RULES_DESCRIPTIONS.md#bool-literal-in-expr
        - name: bool-literal-in-expr

        # https://github.com/mgechev/revive/blob/2a1701aadbedfcc175cb92836a51407bec382652/RULES_DESCRIPTIONS.md#comment-spacings
        - name: comment-spacings

        # https://github.com/mgechev/revive/blob/2a1701aadbedfcc175cb92836a51407bec382652/RULES_DESCRIPTIONS.md#use-any
        - name: use-any

        # https://github.com/mgechev/revive/blob/2a1701aadbedfcc175cb92836a51407bec382652/RULES_DESCRIPTIONS.md#bare-return
        - name: bare-return

        # https://github.com/mgechev/revive/blob/2a1701aadbedfcc175cb92836a51407bec382652/RULES_DESCRIPTIONS.md#empty-block
        - name: empty-block

        # https://github.com/mgechev/revive/blob/2a1701aadbedfcc175cb92836a51407bec382652/RULES_DESCRIPTIONS.md#range-val-address
        - name: range-val-address

        # https://github.com/mgechev/revive/blob/2a1701aadbedfcc175cb92836a51407bec382652/RULES_DESCRIPTIONS.md#range-val-in-closure
        - name: range-val-in-closure

        # https://github.com/mgechev/revive/blob/2a1701aadbedfcc175cb92836a51407bec382652/RULES_DESCRIPTIONS.md#var-declaration
        - name: var-declaration

        # https://github.com/mgechev/revive/blob/2a1701aadbedfcc175cb92836a51407bec382652/RULES_DESCRIPTIONS.md#useless-break
        - name: useless-break

        # https://github.com/mgechev/revive/blob/2a1701aadbedfcc175cb92836a51407bec382652/RULES_DESCRIPTIONS.md#error-naming
        - name: error-naming

        # https://github.com/mgechev/revive/blob/2a1701aadbedfcc175cb92836a51407bec382652/RULES_DESCRIPTIONS.md#indent-error-flow
        - name: indent-error-flow

        # https://github.com/mgechev/revive/blob/2a1701aadbedfcc175cb92836a51407bec382652/RULES_DESCRIPTIONS.md#datarace
        - name: datarace

        # https://github.com/mgechev/revive/blob/2a1701aadbedfcc175cb92836a51407bec382652/RULES_DESCRIPTIONS.md#modifies-value-receiver
        - name: modifies-value-receiver

        # https://github.com/mgechev/revive/blob/2a1701aadbedfcc175cb92836a51407bec382652/RULES_DESCRIPTIONS.md#empty-lines
        - name: empty-lines

        # https://github.com/mgechev/revive/blob/2a1701aadbedfcc175cb92836a51407bec382652/RULES_DESCRIPTIONS.md#duplicated-imports
        - name: duplicated-imports

        # https://github.com/mgechev/revive/blob/2a1701aadbedfcc175cb92836a51407bec382652/RULES_DESCRIPTIONS.md#error-return
        - name: error-return
    sloglint:
      # Enforce using attributes only (overrides no-mixed-args, incompatible with kv-only).
      # https://github.com/go-simpler/sloglint?tab=readme-ov-file#attributes-only
      # Default: false
      attr-only: true
      # Enforce using static values for log messages.
      # https://github.com/go-simpler/sloglint?tab=readme-ov-file#static-messages
      # Default: false
      static-msg: true
      # Enforce a single key naming convention.
      # Values: snake, kebab, camel, pascal
      # https://github.com/go-simpler/sloglint?tab=readme-ov-file#key-naming-convention
      # Default: ""
      key-naming-case: snake
    staticcheck:
      checks:
        - '*'
        # Ignore requirement for package comments.
        - -ST1000
        # Incorrectly formatted error string.
        # https://staticcheck.dev/docs/checks/#ST1005
        # this has become an established standard in Incus and since we are building
        # on top of Incus, we inherit the same style of capitalized error messages.
        - -ST1005
    wsl_v5:
      case-max-lines: 1
      default: none
      enable:
        - err
        - leading-whitespace
        - trailing-whitespace
        - after-block
  exclusions:
    generated: lax
    rules:
      # Apply the bans only to pure packages.
      - linters:
          - forbidigo
        text: "Pure packages must"
        path-except: '^(internal/(provisioning|image|inventory|system|warning|domain)/[^/]+\.go|internal/provisioning/(channel|cluster|cluster_template|server|token|update)/[^/]+\.go|shared/api/.*\.go)$'
      - linters:
          - forbidigo
        text: "Pure packages must"
        path: '_test\.go$'
      # Syscall is only used to map errors and not for side effects.
      - linters:
          - depguard
        path: '^internal/domain/errors\.go$'
        text: "syscall"
      # Baseline. Remove each entry when the violation is fixed.
      - linters:
          - depguard
        path: '^shared/api/error\.go$'
        text: "net/http"
      - linters:
          - depguard
        path: '^internal/provisioning/cluster/cluster_service\.go$'
        text: "net/http"
      - linters:
          - depguard
        path: '^internal/provisioning/server/server_service\.go$'
        text: "net/http"
      - linters:
          - depguard
        path: '^internal/provisioning/cluster_ports\.go$'
        text: "incus/v7/client"
      - linters:
          - forbidigo
        path: '^internal/provisioning/cluster/cluster_service\.go$'
        text: "Pure packages must"
      - linters:
          - forbidigo
        path: '^internal/provisioning/server_model\.go$'
        text: "Pure packages must"
      - linters:
          - forbidigo
        path: '^internal/system/system_service_backup\.go$'
        text: "Pure packages must"
      - linters:
          - forbidigo
        path: '^internal/provisioning/server/server_service\.go$'
        text: "Pure packages must"
      # File system access through os.Root. Tests, tools, the command line
      # client and low level helpers work with paths provided by the user.
      - linters:
          - forbidigo
        text: "Use os.Root for file system access"
        path: '(_test\.go$|^e2e_tests/|^cmd/generate-[^/]+/|^internal/cli/|^internal/client/|^internal/config/cli/|^internal/environment/|^internal/security/signature/signaturetest/|^internal/util/(editor|file|logger|multipartstreamer)/)'
      # The work dir of the secure boot media is passed to external tools, which need absolute paths.
      - linters:
          - forbidigo
        text: "Use os.Root for file system access"
        path: '^internal/provisioning/adapter/securebootmedia/build\.go$'
      - linters:
          - revive
        # generate-database expects to find declarations of the form //generate-database: in the entities package.
        source: '^//generate-database:mapper '
        text: comment-spacing
      - linters:
          - revive
        # generate-expr expects to find declarations of the form //generate-expr: in the inventory package.
        source: '^//generate-expr: '
        text: comment-spacing
      - linters:
          - revive
        # domain-errors expects to find its directives of the form //domain-errors: on the line above the call they apply to.
        source: '^\s*//domain-errors:(ignore|internal) '
        text: comment-spacing
      - linters:
          - revive
        paths:
          - internal/authn/tls
          - internal/maps
          - internal/version
        text: "var-naming: avoid package names that conflict with Go standard library package names"
      - linters:
          - revive
        # It's useful to have a sort and API package but revive disagrees.
        source: '^package (sort|api)$'
        text: var-naming
      - linters:
          - errcheck
          - unparam
        path: ^e2e_tests/
        source: 'mustRun'
      - linters:
          - forbidigo
        path: _test\.go$
        text: Only use in tests
    paths:
      - ^ui/node_modules/
      - third_party$
      - builtin$
      - examples$
      # Go sources vendored by the dependencies of the web UI.
      - ^ui/node_modules/
formatters:
  enable:
    - gci
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/FuturFusion/operations-center)
    goimports:
      local-prefixes:
        - github.com/FuturFusion/operations-center
  exclusions:
    generated: lax
    paths:
      - ^ui/node_modules/
      - third_party$
      - builtin$
      - examples$
      # Go sources vendored by the dependencies of the web UI.
      - ^ui/node_modules/

basePath: /
consumes:
    - application/json
definitions:
    APIACMEChallengeType:
        title: ACMEChallengeType represents challenge types for ACME configuration.
        type: string
        x-go-package: github.com/FuturFusion/migration-manager/shared/api
    APINetwork:
        description: Network represents a network
        properties:
            config:
                $ref: '#/definitions/V7SharedAPIConfigMap'
            description:
                description: |-
                    Description of the profile

                    API extension: entity_description
                example: My new bridge
                type: string
                x-go-name: Description
            locations:
                description: |-
                    Cluster members on which the network has been defined

                    API extension: clustering
                example:
                    - server01
                    - server02
                    - server03
                items:
                    type: string
                readOnly: true
                type: array
                x-go-name: Locations
            managed:
                description: |-
                    Whether this is a managed network

                    API extension: network
                example: true
                readOnly: true
                type: boolean
                x-go-name: Managed
            name:
                description: The network name
                example: mybr0
                readOnly: true
                type: string
                x-go-name: Name
            project:
                description: |-
                    Project name

                    API extension: networks_all_projects
                example: project1
                type: string
                x-go-name: Project
            status:
                description: |-
                    The state of the network (for managed network in clusters)

                    API extension: clustering
                example: Created
                readOnly: true
                type: string
                x-go-name: Status
            type:
                description: The network type
                example: bridge
                readOnly: true
                type: string
                x-go-name: Type
            used_by:
                description: List of URLs of objects using this profile
                example:
                    - /1.0/profiles/default
                    - /1.0/instances/c1
                items:
                    type: string
                readOnly: true
                type: array
                x-go-name: UsedBy
        type: object
        x-go-package: github.com/lxc/incus/v7/shared/api
    APIUpdate:
        properties:
            channels:
                description: Channels holds the name of the channels the update is assigned to.
                example:
                    - stable
                items:
                    type: string
                type: array
                x-go-name: Channels
            origin:
                description: Origin of the Update.
                example: linuxcontainers.org
                type: string
                x-go-name: Origin
            published_at:
                description: PublishedAt is the date, when the Update has been published in RFC3339 format.
                example: "2025-02-12T09:59:00Z"
                format: date-time
                type: string
                x-go-name: PublishedAt
            severity:
                $ref: '#/definitions/UpdateSeverity'
            update_status:
                description: |-
                    Status contains the status the update is currently in.
                    Possible values for status are: pending, ready
                example: ready
                type: string
                x-go-name: Status
                x-go-type: github.com/FuturFusion/operations-center/shared/api.UpdateStatus
            upstream_channels:
                description: |-
                    UpstreamChannels holds the name of the channels from upstream (source)
                    the update is part of.
                example:
                    - stable
                items:
                    type: string
                type: array
                x-go-name: UpstreamChannels
            url:
                description: URL of the File.
                example: releases/download/202501311418/
                type: string
                x-go-name: URL
            uuid:
                description: UUID of the update.
                format: uuid
                type: string
                x-go-name: UUID
            version:
                description: Version of the Update as opaque string.
                example: "202501311418"
                type: string
                x-go-name: Version
        title: Update defines an update.
        type: object
        x-go-package: github.com/FuturFusion/operations-center/shared/api
    Application:
        properties:
            name:
                type: string
                x-go-name: Name
        title: Application represents a single application with the applications seed.
        type: object
        x-go-package: github.com/lxc/incus-os/incus-osd/api/seed
    ApplicationVersionData:
        properties:
            available_version:
                description: |-
                    AvailableVersion is the most recent version available for this application
                    in the update channel assigned to the respective system.
                type: string
                x-go-name: AvailableVersion
            friendly_version:
                description: FriendlyVersion holds the friendly version of the application.
                example: 7.0.0 [202511041800]
                type: string
                x-go-name: FriendlyVersion
            in_maintenance:
                $ref: '#/definitions/InMaintenanceState'
            name:
                description: Name of the software component.
                example: IncusOS
                type: string
                x-go-name: Name
            needs_update:
                description: |-
                    NeedsUpdate is true, if this application needs to be updated
                    (available_version > version).
                type: boolean
                x-go-name: NeedsUpdate
            version:
                description: Version string.
                example: "202512250102"
                type: string
                x-go-name: Version
        title: ApplicationVersionData defines a single version information for an application.
        type: object
        x-go-package: github.com/FuturFusion/operations-center/shared/api
    Applications:
        properties:
            applications:
                items:
                    $ref: '#/definitions/Application'
                type: array
                x-go-name: Applications
            version:
                type: string
                x-go-name: Version
        title: Applications represents the applications seed file.
        type: object
        x-go-package: github.com/lxc/incus-os/incus-osd/api/seed
    BMCAPIType:
        type: string
        x-go-package: github.com/FuturFusion/operations-center/shared/api
    BMCConfig:
        properties:
            api_type:
                $ref: '#/definitions/BMCAPIType'
            auto_pin_certificate:
                description: |-
                    AutoPinCertificate defines, if the certificate presented by the BMC should be
                    accepted on the first connection test. If set to true and Certificate is
                    empty, the certificate presented by the BMC during the connection test is
                    persisted in the Certificate property. If a certificate is provided in the
                    Certificate property or if AutoPinCertificate is set to false, any not trusted
                    Certificate presented by the BMC will cause an error during the connection
                    test.
                type: boolean
                x-go-name: AutoPinCertificate
            certificate:
                description: |-
                    Certificate holds the PEM encoded certificate of the BMC used to establish
                    trust for the TLS connection.
                type: string
                x-go-name: Certificate
            endpoint:
                description: Endpoint holds the base URL of the bmc of the server.
                type: string
                x-go-name: Endpoint
            password:
                description: Password holds the password used to authenticate with the bmc of the server.
                type: string
                x-go-name: Password
            username:
                description: Username holds the username used to authenticate with the bmc of the server.
                type: string
                x-go-name: Username
        type: object
        x-go-package: github.com/FuturFusion/operations-center/shared/api
    BMCData:
        properties:
            bmc_firmware_version:
                description: BMCFirmwareVersion holds the firmware version of the BMC manager.
                example: 1.30.20.10
                type: string
                x-go-name: BMCFirmwareVersion
            bmc_model:
                description: BMCModel holds the model name reported by the BMC manager.
                example: 17G Monolithic
                type: string
                x-go-name: BMCModel
            bmc_protocol:
                description: BMCProtocol holds the protocol name, that is used to interact with the BMC.
                example: Redfish
                type: string
                x-go-name: BMCProtocol
            bmc_protocol_version:
                description: BMCProtocolVersion holds the protocol version reported by the BMC.
                example: 1.16.0
                type: string
                x-go-name: BMCProtocolVersion
            bmc_service_identification:
                description: BMCServiceIdentification holds the service identification of the BMC manager.
                example: XXXXXXX
                type: string
                x-go-name: BMCServiceIdentification
            bmc_vendor:
                description: BMCVendor holds the vendor name reported by the BMC.
                example: Dell
                type: string
                x-go-name: BMCVendor
            last_updated:
                description: LastUpdated is the time, when this information has been updated for the last time in RFC3339 format.
                example: "2024-11-12T16:15:00Z"
                format: date-time
                type: string
                x-go-name: LastUpdated
            server_asset_tag:
                description: ServerAssetTag holds the asset tag of the system.
                example: XXXXXXX
                type: string
                x-go-name: ServerAssetTag
            server_bios_attributes:
                additionalProperties: {}
                description: ServerBIOSAttributes holds the BIOS settings/attributes as reported by the BMC.
                type: object
                x-go-name: ServerBIOSAttributes
            server_bios_version:
                description: ServerBIOSVersion holds the version of the BIOS.
                example: 1.7.5
                type: string
                x-go-name: ServerBIOSVersion
            server_health_status:
                description: ServerHealthStatus holds the reported overall health status for the server.
                example: Warning
                type: string
                x-go-name: ServerHealthStatus
            server_host_name:
                description: ServerHostName hold the host name as reported by the BMC for the server.
                type: string
                x-go-name: ServerHostName
            server_location_indicator_active:
                description: ServerLocationIndicatorActive reports, if the location indicator LED is active.
                example: false
                type: boolean
                x-go-name: ServerLocationIndicatorActive
            server_manufacturer:
                description: ServerManufacturer holds the manufacturer reported for the system.
                example: Dell Inc
                type: string
                x-go-name: ServerManufacturer
            server_model:
                description: ServerModel holds the model of the system.
                example: PowerEdge R770
                type: string
                x-go-name: ServerModel
            server_power_state:
                description: ServerPowerState holds the power state reported for the server.
                example: "On"
                type: string
                x-go-name: ServerPowerState
            server_processor_architecture:
                description: ServerProcessorArchitecture holds the architecture reported for the first CPU.
                example: x86
                type: string
                x-go-name: ServerProcessorArchitecture
            server_processor_instruction_set:
                description: ServerProcessorInstructionSet holds the instruction set reported for the first CPU.
                example: x86-64
                type: string
                x-go-name: ServerProcessorInstructionSet
            server_serial_number:
                description: ServerSerialNumber holds the serial number of the server.
                type: string
                x-go-name: ServerSerialNumber
            server_sku:
                description: ServerSKU holds the Stock Keeping Unit (SKU) for the server.
                type: string
                x-go-name: ServerSKU
            server_sub_model:
                description: ServerSubModel holds information about the sub-model or configuration of the system.
                type: string
                x-go-name: ServerSubModel
            system_uuid:
                description: ServerUUID is the unique system UUID typically derived from hardware, e.g. mainboard.
                example: e9de436e-b94e-4aef-8563-883aec84096e
                type: string
                x-go-name: ServerUUID
            virtual_media:
                additionalProperties:
                    $ref: '#/definitions/BMCVirtualMedia'
                description: |-
                    VirtualMedia holds all virtual media slots (e.g. CD, DVD, floppy, USB)
                    reported by the BMC system or manager, keyed by "<service>:<id>" (e.g. "system:1").
                type: object
                x-go-name: VirtualMedia
        title: BMCData defines the data, that have been collected from the BMC.
        type: object
        x-go-package: github.com/FuturFusion/operations-center/shared/api
    BMCDump:
        additionalProperties:
            $ref: '#/definitions/BMCDumpEntry'
        description: |-
            BMCDump holds the raw responses of the BMC (e.g. Redfish API), keyed by the
            endpoint name or path they were retrieved from.
        type: object
        x-go-package: github.com/FuturFusion/operations-center/shared/api
    BMCDumpEntry:
        properties:
            error:
                $ref: '#/definitions/BMCDumpError'
            response:
                description: Response contains the raw JSON response returned by the BMC.
                x-go-name: Response
            trace:
                description: |-
                    Trace contains additional dumped request and response details
                    (e.g. HTTP headers). Opaque field for human inspection only. Populated if
                    tracing is requested.
                type: string
                x-go-name: Trace
        title: BMCDumpEntry is the result of a single request against the BMC API.
        type: object
        x-go-package: github.com/FuturFusion/operations-center/shared/api
    BMCDumpError:
        properties:
            code:
                description: Code contains the error code, if any.
                type: string
                x-go-name: Code
            message:
                description: Message contains the human readable error message.
                type: string
                x-go-name: Message
            status_code:
                description: StatusCode contains the http status code, if applicable.
                format: int64
                type: integer
                x-go-name: StatusCode
        title: BMCDumpError describes a failed request against the BMC API.
        type: object
        x-go-package: github.com/FuturFusion/operations-center/shared/api
    BMCLogEvent:
        properties:
            entry_code:
                description: EntryCode holds the entry code for the log entry if the entry type is `SEL`.
                example: Informational
                type: string
                x-go-name: EntryCode
            entry_type:
                description: |-
                    EntryType holds the type of the entry. Possible values include (but not
                    limited to): SEL, Event, CXL, Oem.
                example: SEL
                type: string
                x-go-name: EntryType
            message:
                description: Message holds the actual message of the log event.
                example: This is a test log event
                type: string
                x-go-name: Message
            severity:
                description: 'Severity of the log event. Possible values: OK, Warning, Critical'
                example: OK
                type: string
                x-go-name: Severity
            timestamp:
                description: Timestamp of the log event in RFC3339 format.
                example: "2026-07-30T08:04:00Z"
                format: date-time
                type: string
                x-go-name: Timestamp
        title: BMCLogEvent defines a log event from the BMC.
        type: object
        x-go-package: github.com/FuturFusion/operations-center/shared/api
    BMCVirtualMedia:
        description: |-
            BMCVirtualMedia defines a single virtual media slot exposed by the BMC
            (system or manager), e.g. CD, DVD, floppy, or USB.
        properties:
            connected_via:
                description: ConnectedVia holds the connection method of the virtual media (e.g. URI, Applet).
                type: string
                x-go-name: ConnectedVia
            id:
                description: |-
                    ID uniquely identifies this virtual media entry among all virtual media
                    reported by the BMC. It is derived from the service (e.g. "system") and ID.
                example: system:1
                type: string
                x-go-name: ID
            image:
                description: Image holds the URI of the media attached to the virtual media.
                type: string
                x-go-name: Image
            image_name:
                description: ImageName holds the name of the inserted virtual media image.
                type: string
                x-go-name: ImageName
            inserted:
                description: Inserted reports, if a virtual media is currently inserted into this slot.
                type: boolean
                x-go-name: Inserted
            media_types:
                description: MediaTypes holds the media types supported by the virtual media.
                items:
                    type: string
                type: array
                x-go-name: MediaTypes
            status:
                description: Status holds the reported health status of the virtual media.
                type: string
                x-go-name: Status
            transfer_method:
                description: TransferMethod describes how the image transfer occurs.
                type: string
                x-go-name: TransferMethod
            transfer_protocol_type:
                description: TransferProtocolType holds the network protocol used with the image URI.
                type: string
                x-go-name: TransferProtocolType
            write_protected:
                description: WriteProtected reports, if the remote device media prevents writing to that media.
                type: boolean
                x-go-name: WriteProtected
        type: object
        x-go-package: github.com/FuturFusion/operations-center/shared/api
    CertificatePost:
        description: |-
            CertificatePost represents the fields available for an update of the
            system certificate (server certificate) and key.
        properties:
            certificate:
                description: The new certificate (X509 PEM encoded) for the system (server certificate).
                example: X509 PEM certificate
                type: string
                x-go-name: Certificate
            key:
                description: The new certificate key (X509 PEM encoded) for the system (server key).
                example: X509 PEM certificate key
                type: string
                x-go-name: Key
        type: object
        x-go-package: github.com/FuturFusion/operations-center/shared/api/system
    CertificatesPost:
        description: CertificatesPost represents the fields of a new certificate
        properties:
            certificate:
                description: |-
                    The certificate itself, as PEM encoded X509 (or as base64 encoded X509 on POST)

                    API extension: certificate_self_renewal
                example: X509 PEM certificate
                type: string
                x-go-name: Certificate
            description:
                description: |-
                    Certificate description

                    API extension: certificate_description
                example: X509 certificate
                type: string
                x-go-name: Description
            name:
                description: Name associated with the certificate
                example: castiana
                type: string
                x-go-name: Name
            projects:
                description: |-
                    List of allowed projects (applies when restricted)

                    API extension: certificate_project
                example:
                    - default
                    - foo
                    - bar
                items:
                    type: string
                type: array
                x-go-name: Projects
            restricted:
                description: |-
                    Whether to limit the certificate to listed projects

                    API extension: certificate_project
                example: true
                type: boolean
                x-go-name: Restricted
            token:
                description: |-
                    Whether to create a certificate add token

                    API extension: certificate_token
                example: true
                type: boolean
                x-go-name: Token
            trust_token:
                description: Trust token (used to add an untrusted client)
                example: blah
                type: string
                x-go-name: TrustToken
            type:
                description: Usage type for the certificate
                example: client
                type: string
                x-go-name: Type
        type: object
        x-go-package: github.com/lxc/incus/v7/shared/api
    Channel:
        properties:
            description:
                description: Description of the channel.
                example: stable channel, used for production
                type: string
                x-go-name: Description
            last_updated:
                description: LastUpdated is the time, when this information has been updated for the last time in RFC3339 format.
                example: "2024-11-12T16:15:00Z"
                format: date-time
                type: string
                x-go-name: LastUpdated
            name:
                description: Name of the channel.
                example: stable
                type: string
                x-go-name: Name
        title: Channel defines a channel.
        type: object
        x-go-package: github.com/FuturFusion/operations-center/shared/api
    ChannelPost:
        properties:
            description:
                description: Description of the channel.
                example: stable channel, used for production
                type: string
                x-go-name: Description
            name:
                description: Name of the channel.
                example: stable
                type: string
                x-go-name: Name
        title: ChannelPost represents the fields available when creating a channel.
        type: object
        x-go-package: github.com/FuturFusion/operations-center/shared/api
    ChannelPut:
        properties:
            description:
                description: Description of the channel.
                example: stable channel, used for production
                type: string
                x-go-name: Description
        title: ChannelPut represents the fields available for update for a channel.
        type: object
        x-go-package: github.com/FuturFusion/operations-center/shared/api
    Cluster:
        properties:
            certificate:
                description: Certificate of the cluster endpoint in PEM encoded format.
                example: |-
                    -----BEGIN CERTIFICATE-----
                    ...
                    -----END CERTIFICATE-----
                type: string
                x-go-name: Certificate
            channel:
                description: Channel the cluster is following for updates.
                example: stable
                type: string
                x-go-name: Channel
            config:
                $ref: '#/definitions/ClusterConfig'
            connection_url:
                description: |-
                    URL, hostname or IP address of the cluster endpoint.
                    This is only user facing, e.g. the address of a load balancer infront of
                    the cluster and not used by Operations Center for direct communication
                    Operations Center relies on the connection URL of the cluster members.
                example: https://incus.local:6443
                type: string
                x-go-name: ConnectionURL
            description:
                description: Description of the cluster.
                example: Lab cluster with limited resources
                type: string
                x-go-name: Description
            fingerprint:
                description: Fingerprint in SHA256 format of the certificate.
                example: fd200419b271f1dc2a5591b693cc5774b7f234e1ff8c6b78ad703b6888fe2b69
                type: string
                x-go-name: Fingerprint
            last_updated:
                description: LastUpdated is the time, when this information has been updated for the last time in RFC3339 format.
                example: "2024-11-12T16:15:00Z"
                format: date-time
                type: string
                x-go-name: LastUpdated
            name:
                description: A human-friendly name for this cluster.
                example: MyCluster
                type: string
                x-go-name: Name
            properties:
                $ref: '#/definitions/OperationsCenterSharedAPIConfigMap'
            status:
                description: |-
                    Status contains the status the cluster is currently in from the point of view of Operations Center.
                    Possible values for status are: pending, ready
                example: pending
                type: string
                x-go-name: Status
                x-go-type: github.com/FuturFusion/operations-center/shared/api.ClusterStatus
            update_status:
                $ref: '#/definitions/ClusterUpdateStatus'
        title: Cluster defines a cluster of servers running Hypervisor OS.
        type: object
        x-go-package: github.com/FuturFusion/operations-center/shared/api
    ClusterAddServersPost:
        description: |-
            ClusterAddServersPost represents a cluster add servers request containing
            the names of the servers to be added to the cluster.
        properties:
            server_names:
                description: Names of the servers to be added to the cluster.
                example:
                    - server1
                    - server2
                items:
                    type: string
                type: array
                x-go-name: ServerNames
            skip_post_join_operations:
                description: |-
                    If set to true, the post join operations (namely the creation of the local storage volumes for backups,
                    images and logs) are skipped.
                type: boolean
                x-go-name: SkipPostJoinOperations
        type: object
        x-go-package: github.com/FuturFusion/operations-center/shared/api
    ClusterArtifact:
        properties:
            cluster:
                description: Cluster the artifact belongs to.
                example: cluster01
                type: string
                x-go-name: Cluster
            description:
                description: Description of the cluster artifact.
                example: Terraform configuration
                type: string
                x-go-name: Description
            files:
                description: Files contains the list of files, that form the given artifact.
                items:
                    $ref: '#/definitions/ClusterArtifactFile'
                type: array
                x-go-name: Files
            last_updated:
                description: |-
                    LastUpdated is the time, when this information has been updated for the
                    last time in RFC3339 format.
                example: "2024-11-12T16:15:00Z"
                format: date-time
                type: string
                x-go-name: LastUpdated
            name:
                description: Name of the artifact
                example: terraform-configuration
                type: string
                x-go-name: Name
            properties:
                $ref: '#/definitions/OperationsCenterSharedAPIConfigMap'
        title: ClusterArtifact defines an artifact, which belongs to a given cluster.
        type: object
        x-go-package: github.com/FuturFusion/operations-center/shared/api
    ClusterArtifactFile:
        properties:
            mime_type:
                description: |-
                    MimeType of the artifact file, used when the file content is returned
                    to set the correct Content-Type header.
                example: text/plain
                type: string
                x-go-name: MimeType
            name:
                description: Name of the artifact file.
                example: somefile.txt
                type: string
                x-go-name: Name
            size:
                description: Size of the File in bytes.
                example: 54300000
                format: int64
                type: integer
                x-go-name: Size
        title: ClusterArtifactFile defines a single file of a cluster artifact.
        type: object
        x-go-package: github.com/FuturFusion/operations-center/shared/api
    ClusterBulkUpdateAction:
        type: string
        x-go-package: github.com/FuturFusion/operations-center/shared/api
    ClusterBulkUpdatePost:
        description: |-
            ClusterBulkUpdatePost represents a cluster bulk update request containing
            action and optional arguments.
        properties:
            action:
                $ref: '#/definitions/ClusterBulkUpdateAction'
            arguments:
                description: |-
                    Arguments for the action, the exact structure depends on the
                    defined action.
                x-go-name: Arguments
        type: object
        x-go-package: github.com/FuturFusion/operations-center/shared/api
    ClusterCertificatePut:
        properties:
            cluster_certificate:
                description: The new certificate (X509 PEM encoded) for the cluster.
                example: X509 PEM certificate
                type: string
                x-go-name: ClusterCertificate
            cluster_certificate_key:
                description: The new certificate key (X509 PEM encoded) for the cluster.
                example: X509 PEM certificate key
                type: string
                x-go-name: ClusterCertificateKey
        title: ClusterCertificatePut represents the certificate and key pair for all cluster members.
        type: object
        x-go-package: github.com/FuturFusion/operations-center/shared/api
    ClusterConfig:
        description: |-
            ClusterConfig contains cluster wide configuration used by Operations Center
            when interacting with the cluster.
        properties:
            rolling_restart:
                $ref: '#/definitions/ClusterConfigRollingRestart'
        type: object
        x-go-package: github.com/FuturFusion/operations-center/shared/api
    ClusterConfigRollingRestart:
        properties:
            post_restore_delay:
                description: |-
                    PostRestoreDelay holds the time.Duration (as string, e.g. "15m"), that is
                    waited between the resore of a server and the evacuation of the next
                    server. This should be set if RestoreMode is kept at the default value in
                    order to grant a cluster enough time to move previously evacuated instances
                    back to their originating server.

            operationId: servers_get
            parameters:
                - description: Cluster name
                  in: query
                  name: cluster
                  type: string
                  x-example: cluster
                - description: Status to filter for.
                  in: query
                  name: status
                  type: string
                  x-example: ready
                - description: Filter expression
                  in: query
                  name: filter
                  type: string
                  x-example: name == "value"
